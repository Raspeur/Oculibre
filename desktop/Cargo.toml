[workspace]
resolver = "2"
members = ["app/src-tauri", "cli", "core", "protocol"]
# cargo-fuzz crate, needs a nightly toolchain: cd protocol && cargo +nightly fuzz run decode
exclude = ["protocol/fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"

# Decoding and pixel conversion are far too slow unoptimised, even while developing.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
