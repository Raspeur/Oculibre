[package]
name = "oculibre-vcam-shm"
description = "Shared memory between Oculibre and its Windows virtual cameras: the picture, YUY2"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
] }
