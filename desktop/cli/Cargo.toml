[package]
name = "oculibre-cli"
description = "Oculibre desktop receiver (command line)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oculibre"
path = "src/main.rs"

[dependencies]
# Cisco OpenH264, BSD-2-Clause, compiled from source: no system library needed.
openh264 = "0.9"
libc = "0.2"
