[package]
name = "oculibre-cli"
description = "Oculibre desktop receiver (command line)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oculibre"
path = "src/main.rs"

[features]
default = ["ffmpeg"]
# Hardware and fast software decoding through FFmpeg (see desktop/core). Without it: OpenH264 only.
ffmpeg = ["oculibre-core/ffmpeg"]

[dependencies]
oculibre-core = { path = "../core", default-features = false }
oculibre-protocol = { path = "../protocol" }
openh264 = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
