[package]
name = "oculibre-cli"
description = "Oculibre desktop receiver (command line)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oculibre"
path = "src/main.rs"

[dependencies]
oculibre-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cisco OpenH264, BSD-2-Clause, compiled from source: no system library needed.
openh264 = "0.9"
libc = "0.2"
# Wi-Fi secure channel (docs/research/secure-channel.typ): TLS 1.2/1.3 with pinned self-signed keys.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
ring = "0.17"
# Pairing QR code shown in the terminal.
qrcode = { version = "0.14", default-features = false }
