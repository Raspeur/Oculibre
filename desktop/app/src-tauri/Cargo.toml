[package]
name = "oculibre-app"
description = "Oculibre desktop app (Tauri): the window over the oculibre-core engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The app's code lives in a library (src/lib.rs) and main.rs only calls it: the layout Tauri 2
# expects. `_lib` keeps the library name apart from the binary's.
name = "oculibre_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oculibre-core = { path = "../../core" }
# tray-icon: the icon and its menu in the system tray (Linux: libayatana-appindicator).
tauri = { version = "2", features = ["tray-icon"] }
# Start with the computer (Linux: a .desktop file in ~/.config/autostart).
tauri-plugin-autostart = "2"
# One Oculibre at a time: launching it again shows the window of the one already running (Linux:
# through D-Bus) instead of starting a second receiver that cannot get the port.
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Is there a system tray to show our icon? (GNOME without the AppIndicator extension, as on
# Debian, has none.) Already used by the single-instance plugin: no new crate.
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
