<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Oculibre — écran principal du téléphone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="oc-phone" style="padding: 24px 20px; gap: 20px">

  <header style="display: flex; align-items: center; justify-content: space-between">
    <div class="oc-cluster" style="gap: 10px">
      <div class="oc-logo oc-logo--sm"><img src="./oculibre_logo.svg" alt=""></div>
      <span class="oc-brand" style="font-size: 19px">Oculibre</span>
    </div>
    <a href="PhoneWelcomeB.dc.html" class="oc-icon-btn oc-icon-btn--lg" aria-label="Réglages">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </a>
  </header>

  <sc-if value="{{showAlert}}" hint-placeholder-val="{{true}}">
    <a href="PhoneWelcomeB.dc.html" class="oc-banner">
      <span class="oc-badge oc-badge--todo" style="width: 28px; height: 28px; font-size: var(--oc-text-lg)" aria-hidden="true">!</span>
      <span class="oc-row__label" style="flex: 1 1 auto">
        <span class="oc-strong" style="font-size: var(--oc-text-base)">Un réglage a été retiré</span>
        <span style="font-size: var(--oc-text-md); color: var(--oc-text-2)">La webcam risque de se couper écran éteint.</span>
      </span>
      <span class="oc-row__value oc-row__value--todo">Corriger ›</span>
    </a>
  </sc-if>

  <section aria-label="Ordinateur relié" class="oc-card oc-card--padded oc-cluster" style="flex-wrap: nowrap; gap: 14px">
    <div class="oc-badge" style="width: 44px; height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9D3E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </div>
    <div class="oc-row__label" style="gap: 3px">
      <span class="oc-strong">raspeur-ubuntu-studio</span>
      <span class="oc-muted" style="display: inline-flex; align-items: center; gap: 6px; font-size: var(--oc-text-md)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3DDC97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Wi-Fi · connexion chiffrée
      </span>
    </div>
  </section>

  <section class="oc-stack" style="flex: 1 1 auto; align-items: center; justify-content: center; gap: 22px">
    <button type="button" class="oc-big-button" onClick="{{toggle}}" aria-pressed="{{pressed}}">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      <span>{{bigText}}</span>
    </button>
    <div class="oc-stack" style="align-items: center; gap: 6px; text-align: center">
      <span class="oc-title" style="{{stateStyle}}">{{stateText}}</span>
      <span class="oc-muted" style="font-size: var(--oc-text-base)">{{detail}}</span>
    </div>
  </section>

  <div class="oc-card" style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <label for="screen-off" class="oc-row__label" style="gap: 3px; cursor: pointer">
      <span class="oc-strong">Éteindre l'écran pendant le direct</span>
      <span class="oc-row__hint">Économise la batterie et la chauffe</span>
    </label>
    <input id="screen-off" type="checkbox" checked style="width: 22px; height: 22px; accent-color: var(--oc-accent); flex: 0 0 auto">
  </div>

  <p class="oc-muted" style="margin: 0; font-size: var(--oc-text-md); text-align: center; line-height: 1.5">La caméra et la qualité se choisissent depuis l'ordinateur.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showAlert":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { live: false };
  }
  renderVals() {
    const live = this.state.live;
    return {
      // Mockup switch (Tweaks): the warning shown when Android withdrew a permission.
      showAlert: this.props.showAlert ?? true,
      toggle: () => this.setState({ live: !live }),
      pressed: live ? 'true' : 'false',
      bigText: live ? 'Arrêter' : 'Démarrer',
      stateText: live ? 'En direct' : 'Prêt',
      stateStyle: 'font-size: 22px; color: ' + (live ? 'var(--oc-live)' : 'var(--oc-text)'),
      detail: live ? 'Caméra arrière · 1080p · 60 i/s · 68 ms' : 'L’ordinateur vous attend',
    };
  }
}
</script>
</body>
</html>
