<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Oculibre — premier lancement, une étape par écran</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="oc-phone" style="padding: 24px 24px 28px">

  <div class="oc-stack" style="gap: 10px">
    <div class="oc-progress" aria-hidden="true">
      <sc-for list="{{segments}}" as="g" hint-placeholder-count="3">
        <span class="{{g.cls}}"></span>
      </sc-for>
    </div>
    <span class="oc-muted" style="font-size: var(--oc-text-md)">{{progressText}}</span>
  </div>

  <div class="oc-stack" style="flex: 1 1 auto; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 0 8px">
    <div class="{{iconClass}}">
      <sc-if value="{{isCamera}}" hint-placeholder-val="{{true}}">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FE633C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
      </sc-if>
      <sc-if value="{{isBattery}}" hint-placeholder-val="{{false}}">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FE633C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"></rect><path d="M22 11v2M6 10v4M10 10v4"></path></svg>
      </sc-if>
      <sc-if value="{{isPair}}" hint-placeholder-val="{{false}}">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FE633C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
      </sc-if>
      <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#3DDC97" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      </sc-if>
    </div>
    <h1 class="oc-title oc-title--lg">{{title}}</h1>
    <p class="oc-muted" style="margin: 0; font-size: var(--oc-text-lg); line-height: 1.55; max-width: 300px">{{text}}</p>
  </div>

  <div class="oc-stack">
    <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
      <button type="button" class="oc-btn oc-btn--primary oc-btn--lg oc-btn--block" onClick="{{next}}">{{action}}</button>
    </sc-if>
    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <a href="PhoneHome.dc.html" class="oc-btn oc-btn--primary oc-btn--lg oc-btn--block">C’est parti</a>
    </sc-if>
    <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
      <button type="button" class="oc-btn oc-btn--ghost oc-btn--block" style="min-height: 44px; font-size: var(--oc-text-base)" onClick="{{skip}}">{{skipText}}</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0 };
  }
  renderVals() {
    const step = this.state.step;
    const pages = [
      { title: 'Accès à la caméra', text: 'Oculibre filme avec la caméra du téléphone. L’image ne va que vers votre ordinateur, jamais sur Internet.', action: 'Autoriser la caméra', skipText: 'Pourquoi ?' },
      { title: 'Rester actif écran éteint', text: 'Pour que la webcam ne se coupe pas au milieu d’un appel quand l’écran s’éteint.', action: 'Ouvrir le réglage', skipText: 'Plus tard' },
      { title: 'Relier à votre ordinateur', text: 'Ouvrez Oculibre sur l’ordinateur, cliquez sur « Ajouter un téléphone », puis scannez le QR code. Par câble USB, il suffit de brancher le téléphone.', action: 'Scanner le QR code', skipText: 'Plus tard' },
      { title: 'Tout est prêt', text: 'La prochaine fois, ouvrez simplement Oculibre et appuyez sur Démarrer.', action: '', skipText: '' },
    ];
    const p = pages[Math.min(step, 3)];
    const segments = [0, 1, 2].map((i) => ({
      cls: 'oc-progress__seg' + (i < step ? ' oc-progress__seg--done' : i === step ? ' oc-progress__seg--current' : ''),
    }));
    const go = () => this.setState({ step: Math.min(step + 1, 3) });
    return {
      segments,
      progressText: step < 3 ? 'Étape ' + (step + 1) + ' sur 3' : 'Terminé',
      title: p.title, text: p.text, action: p.action, skipText: p.skipText,
      isCamera: step === 0, isBattery: step === 1, isPair: step === 2, isDone: step >= 3, notDone: step < 3,
      iconClass: step >= 3 ? 'oc-hero-icon oc-hero-icon--ok' : 'oc-hero-icon',
      next: go,
      skip: step === 0 ? () => {} : go,
    };
  }
}
</script>
</body>
</html>
