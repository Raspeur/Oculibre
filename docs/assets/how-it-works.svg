  <title
     id="title">How Oculibre works</title>
  <desc
     id="desc">The Android phone films and encodes the video, sends it to the computer over Wi-Fi (encrypted, paired with a QR code) or over the USB cable; Oculibre on the computer decodes it on the graphics card and shows it as a webcam named Oculibre in every app: OBS, Zoom, Teams, Discord, Google Meet.</desc>
