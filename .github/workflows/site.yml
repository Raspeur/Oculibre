# Publishes oculibre.org (site/) on GitHub Pages: on every merge that touches the site, and when a
# release is published (the download buttons point to the files of the latest release). Pull
# requests only check that the site builds.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/assets/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/assets/**", ".github/workflows/site.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Build
        run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with: { path: site/build }

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
