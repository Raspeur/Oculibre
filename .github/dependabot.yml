# Dependabot: security alerts at any time, and once a month one pull request per ecosystem with the
# updates that should not break anything (see CONTRIBUTING.md, "Dependency updates").
#
# Cargo and npm: `lockfile-only` moves only the lock files, within the ranges the manifests allow
# ("2" for tauri, "0.62" for windows): the updates Cargo and npm themselves consider compatible
# (for a 0.x crate, 0.62.1 → 0.62.2 but never 0.62 → 0.100). Bigger updates are done by hand, in
# their own branch: some must move together (windows and windows-core), ffmpeg-sys-next follows
# the FFmpeg version of the distributions.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /desktop
    schedule: { interval: monthly }
    versioning-strategy: lockfile-only
    groups:
      rust: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /desktop/app
    schedule: { interval: monthly }
    versioning-strategy: lockfile-only
    groups:
      npm: { patterns: ["*"] }
  # The Android app has no runtime dependency (only the Gradle plugins and JUnit for tests).
  # Major versions of the Android Gradle plugin, Kotlin or Gradle are migrations, done by hand.
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    groups:
      gradle: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
